name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          enable-cache: false
          cache-local-path: ${{ github.workspace }}/artifacts/ci/uv-cache
      - name: Install pinned Python
        run: uv python install
        timeout-minutes: 5
      - name: Check lock consistency without network
        run: uv lock --check --offline
      - name: Install locked dependencies
        run: uv sync --locked
        timeout-minutes: 5
      - name: Record environment
        run: |
          uv --version
          uv run --locked --offline python -c "import sys, platform, importlib.metadata as m; print(sys.version); print(platform.platform()); print({p:m.version(p) for p in ['numpy', 'pandas', 'scikit-learn', 'pytest', 'ruff']})"
      - name: Lint
        run: uv run --locked --offline ruff check .
      - name: Check formatting
        run: uv run --locked --offline ruff format --check .
      - name: Prepare pytest workspace parent
        run: uv run --locked --offline python -c "from pathlib import Path; Path('artifacts/ci').mkdir(parents=True, exist_ok=True)"
      - name: Offline tests
        run: uv run --locked --offline pytest -q --basetemp=artifacts/ci/pytest-first
        timeout-minutes: 5
      - name: Repeat offline tests (NFR-019)
        run: uv run --locked --offline pytest -q --basetemp=artifacts/ci/pytest-repeat
        timeout-minutes: 5
